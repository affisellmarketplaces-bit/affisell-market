name: Preview environment check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Environment safety (env:check)
        run: npm run env:check
        env:
          NODE_ENV: development

      - name: Preview prod-DB guard (simulated)
        run: npm run env:check
        env:
          VERCEL_ENV: preview
          DATABASE_URL: postgresql://u:p@ep-misty-sea-al1ne07p.c-3.eu-central-1.aws.neon.tech/neondb?sslmode=require
        continue-on-error: true
