name: Resend — live buyer-notice probe (manual)

# Sends REAL e-mails through Resend with the production code path (rendering, sendResendEmail, idempotency key), to
# TEST_EMAIL_TO only: the sender must be Resend's sandbox (onboarding@resend.dev), so every message is redirected to
# that address, exactly as the app does outside production. Proves Resend's idempotency with its own answers and
# delivers every language / state for a visual check in Gmail / Outlook. Manual only — never on a push or a PR.
#
# Needs two repository secrets (set by the founder, never printed): RESEND_TEST_API_KEY (a Resend key — a key of the
# account whose owner address is TEST_EMAIL_TO, since the sandbox sender only delivers there) and RESEND_TEST_EMAIL_TO.
# Without them the job stops at the first step, sends nothing and says why.
on:
  workflow_dispatch:
    inputs:
      replay_key:
        description: "Optional: idempotency key printed by a run >= 24 h ago (checks the retention window)"
        required: false
      replay_id:
        description: "Optional: the first_id printed by that same run"
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the test secrets
        env:
          KEY: ${{ secrets.RESEND_TEST_API_KEY }}
          TO: ${{ secrets.RESEND_TEST_EMAIL_TO }}
        run: |
          if [ -z "$KEY" ] || [ -z "$TO" ]; then
            echo "::error::RESEND_TEST_API_KEY and RESEND_TEST_EMAIL_TO repository secrets are required — nothing sent."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Live probe (sandbox sender, TEST_EMAIL_TO only)
        env:
          AFFISELL_LIVE_RESEND: "1"
          RESEND_API_KEY: ${{ secrets.RESEND_TEST_API_KEY }}
          RESEND_FROM_EMAIL: "Affisell test <onboarding@resend.dev>"
          TEST_EMAIL_TO: ${{ secrets.RESEND_TEST_EMAIL_TO }}
          REPLAY_KEY: ${{ inputs.replay_key }}
          REPLAY_ID: ${{ inputs.replay_id }}
        run: npx vitest run lib/__tests__/live-resend-buyer-notice.test.ts --reporter=verbose
