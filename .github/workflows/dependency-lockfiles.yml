name: Dependency lockfiles (proposal)

# When package.json changes on a pull request, recompute BOTH lockfiles from the registry (no install, no scripts, no
# secret) and the OSV dependency inventory, and publish them as an artifact. Nothing is committed by this job: the
# developer downloads, reviews and commits them (AGENTS.md « Dependencies »). Exists because the agent environments have
# no npm registry access.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - ".github/dependency-targets.txt"
      - ".github/workflows/dependency-lockfiles.yml"

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm lockfile (what Vercel installs)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      # Targeted, in-range updates of TRANSITIVE packages (security fixes): one package name per line in
      # .github/dependency-targets.txt (comments with #). `npm update <names>` stays inside the semver ranges the
      # dependents declare — it never changes package.json, never jumps a major.
      - name: Targeted in-range updates (npm)
        run: |
          T=$(grep -v '^\s*#' .github/dependency-targets.txt 2>/dev/null | tr -s ' \n' ' ' | xargs || true)
          if [ -n "$T" ]; then echo "npm update: $T"; npm update --package-lock-only --ignore-scripts --no-audit --no-fund $T; fi
      - name: pnpm lockfile (local node_modules) — pnpm 11.22.0, as the Corepack shim of the repo resolves
        run: |
          npx --yes pnpm@11.22.0 install --lockfile-only --ignore-scripts
          T=$(grep -v '^\s*#' .github/dependency-targets.txt 2>/dev/null | tr -s ' \n' ' ' | xargs || true)
          if [ -n "$T" ]; then echo "pnpm update: $T"; npx --yes pnpm@11.22.0 update --lockfile-only --ignore-scripts --depth Infinity $T || echo "pnpm targeted update failed (see log)"; fi
      - name: OSV dependency inventory
        run: node scripts/generate-dependency-inventory.mjs
      - name: Summary
        run: |
          git --no-pager diff --stat
          node -e "const l=require('./package-lock.json').packages;const t=require('fs').existsSync('.github/dependency-targets.txt')?require('fs').readFileSync('.github/dependency-targets.txt','utf8').split('\n').map(s=>s.trim()).filter(s=>s&&!s.startsWith('#')):[];for(const n of ['next','sharp',...t]){const v=[...new Set(Object.entries(l).filter(([k,e])=>k.endsWith('node_modules/'+n)&&!e.dev).map(([,e])=>e.version))];console.log(n,v.join(' '))}"
          grep -nE "^  (dompurify|proxy-addr|body-parser|fast-uri|js-yaml|tmp|brace-expansion|hono|ip-address|'@grpc/grpc-js'|'@modelcontextprotocol/sdk')@" pnpm-lock.yaml | head -40 || true
      # Also in the log (gzip + base64 between markers): artifact downloads go through a storage host some agent
      # environments can not reach, the GitHub API log endpoint they can.
      - name: Patch in the log
        run: |
          echo "LOCKFILES-PATCH-BEGIN"
          git --no-pager diff --binary | gzip -9 | base64 -w0
          echo
          echo "LOCKFILES-PATCH-END"
      - uses: actions/upload-artifact@v4
        with:
          name: lockfiles
          path: |
            package-lock.json
            pnpm-lock.yaml
            lib/strategic-intelligence/external/dependency-inventory.json
          retention-days: 7
