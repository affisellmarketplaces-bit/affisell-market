name: Lighthouse mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Production build
        id: build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          LIGHTHOUSE_CI: "1"
          CI: "true"

      - name: Verify PWA shell wiring
        if: steps.build.outcome == 'success'
        run: npm run verify:pwa-shell

      - name: Lighthouse mobile (home)
        id: lighthouse
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run lighthouse:mobile
        env:
          LIGHTHOUSE_CI: "1"
          CI: "true"
          # Optional — enables LHCI GitHub status checks when configured in repo secrets.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Lighthouse diagnostics (LCP element and phases, scripts, requests)
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/lighthouse-diagnostics.mjs

      - name: Home server-time probe (TTFB, real-Chromium LCP candidates, server logs)
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          npm run start -- -p 3005 > /tmp/home-probe-server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3005/api/health 2>/dev/null && break; sleep 1; done
          for path in / / /fr /marketplace; do
            curl -s -o /dev/null -w "[home-probe] ${path} status=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}\n" "http://localhost:3005${path}"
          done
          node scripts/lcp-candidates.mjs http://localhost:3005/ 20000 || true
          node scripts/lcp-candidates.mjs http://localhost:3005/ 20000 affisell_cookie_consent=false || true
          grep -E "home-marketplace-shell|home-race|home-lcp|Error|error" /tmp/home-probe-server.log | sort | uniq -c | sort -rn | head -30 || true
          kill %1 || true

      - name: Publish Lighthouse summary
        if: steps.build.outcome == 'success' && steps.lighthouse.outcome == 'success'
        run: node scripts/lighthouse-ci-summary.mjs

      - name: Note skipped Lighthouse (build failed)
        if: always() && steps.build.outcome != 'success'
        run: echo "::warning::Production build failed — Lighthouse not run."

      - name: Comment Lighthouse on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs")
            if (!fs.existsSync("lighthouse-summary.md")) return
            const body = fs.readFileSync("lighthouse-summary.md", "utf8")
            const marker = "<!-- affisell-lighthouse-mobile -->"
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Fail on severe Lighthouse regression
        if: steps.build.outcome == 'success' && steps.lighthouse.outcome == 'failure'
        run: |
          echo "Severe Lighthouse regression — see summary / PR comment."
          exit 1

  # Server-side timing of the home with a REAL (throwaway) PostgreSQL: does the first byte wait for the catalogue?
  # Three databases: fast (local), slow (+150 ms per packet through scripts/perf/tcp-delay-proxy.mjs — a distant or
  # waking database), unreachable (a non-routable address). Measures only; no secret, nothing outside the runner.
  home-server-timing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: affisell_perf
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d affisell_perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: affisell_perf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Create the schema from the Prisma datamodel (throwaway database)
        env:
          DATABASE_URL: postgresql://ci@placeholder.invalid:5432/placeholder
        run: |
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script 2>/dev/null \
            | grep -v '^\[ensure-direct-url\]' > "$RUNNER_TEMP/schema.sql"
          psql -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/schema.sql"
      - name: Production build (no database at build time)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "true"
      - name: Time the streamed home against a fast, a slow and an unreachable database
        continue-on-error: true
        run: |
          node scripts/perf/tcp-delay-proxy.mjs 6543 127.0.0.1:5432 150 &
          start() { DATABASE_URL="$2" DIRECT_URL="$2" npm run start -- -p "$1" > "/tmp/srv-$1.log" 2>&1 & }
          start 3011 "postgresql://postgres@127.0.0.1:5432/affisell_perf"
          start 3012 "postgresql://postgres@127.0.0.1:6543/affisell_perf"
          start 3013 "postgresql://postgres@10.255.255.1:5432/affisell_perf?connect_timeout=30"
          for p in 3011 3012 3013; do for i in $(seq 1 60); do curl -s -o /dev/null "http://localhost:$p/manifest.webmanifest" && break; sleep 1; done; done
          for run in 1 2 3; do
            node scripts/perf/stream-timing.mjs http://localhost:3011/ "fast db, run $run"
            node scripts/perf/stream-timing.mjs http://localhost:3012/ "slow db (+150 ms/packet), run $run"
          done
          node scripts/perf/stream-timing.mjs http://localhost:3013/ "unreachable db, run 1"
          node scripts/perf/stream-timing.mjs http://localhost:3013/ "unreachable db, run 2"
          for p in 3011 3012 3013; do echo "--- server $p"; grep -E "home-marketplace-shell|home-race|home_shell" "/tmp/srv-$p.log" | cut -c1-240 | sort | uniq -c | head -8; done
