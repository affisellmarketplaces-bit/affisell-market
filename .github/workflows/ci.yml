name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # Every tracked file: provider keys, credential literals and the published (compromised) credentials by hash
      # (scripts/lib/secret-scan.mjs, scripts/lib/compromised-credentials.mjs). The repository is public.
      - name: Secret scan
        run: node scripts/verify-no-secrets.mjs --all

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Production build
        run: npm run build
