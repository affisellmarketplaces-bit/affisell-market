name: Process Stripe transfers

# Hobby Vercel crons are once/day only — run transfers every 15 min via GitHub Actions.
# Money cron (supplier / affiliate payouts): a failure makes the run red (curl -f exits non-zero) and the `if: failure()` step
# alerts (annotation + POST /api/cron/notify-failure → Slack / Discord, see scheduled-crons.yml, finalisation master doc J1).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  process-transfers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Trigger Vercel job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$VERCEL_APP_URL" ]; then
            echo "Set GitHub secrets CRON_SECRET and VERCEL_APP_URL (e.g. https://affisell-market.vercel.app)"
            exit 1
          fi
          curl -fsS --max-time 330 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${VERCEL_APP_URL%/}/api/jobs/process-transfers"
      - name: Alert on failure
        if: failure()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          FAILED_ROUTES: /api/jobs/process-transfers
        run: bash scripts/ci/notify-cron-failure.sh
